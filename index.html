<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Movie Premium Mod</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* কার্ডের মূল কনটেইনার বা বড় বক্স */
        .card-container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        /* উপরের লেখাটি */
        .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 20px;
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ছবির ফ্রেম বা ইমেজের বক্স */
        .image-box {
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 20px;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-box img:hover {
            transform: scale(1.05);
        }

        /* ডাউনলোড বাটন */
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.5);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- ১. বক্সের উপরের লেখা -->
        <h2 class="title">skip all ads for download movie premium mod for free</h2>

        <!-- ২. লিংক থেকে ইমেজ লোড হওয়ার বক্স -->
        <div class="image-box">
            <img src="https://image.winudf.com/v2/image1/Y29tLmNlbnRhdXJ1cy5tb3Jhc19iYW5uZXJfMTczMjk1MDYzNV8wNDg/banner.jpg?fakeurl=1&w=1200" alt="Movie Poster">
        </div>

        <!-- ৩. ডাউনলোড বাটন (এখানে নতুন ট্যাবে লিংক ওপেন হবে) -->
        <a href="YOUR_DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">
            📥 Download Now
        </a>
    </div>

</body>
</html>
