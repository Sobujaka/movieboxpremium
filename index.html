<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Movie Premium Mod</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Container for Side-by-Side Grid Layout */
        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: stretch;
            max-width: 1000px;
            width: 100%;
        }

        /* Card Container */
        .card-container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 25px;
            flex: 1;
            min-width: 320px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Title Style */
        .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 20px;
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Image Box */
        .image-box {
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 20px;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-box img:hover {
            transform: scale(1.05);
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.5);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Responsive Video Container */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #0f172a;
            margin-bottom: 20px;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

            </a>
        </div>

        <!-- 2nd Box: YouTube Video Card (Dan Pasher Box) -->

            <div class="video-box">
                <!-- YouTube Video Embed (Apnar Video ID-ti 'dQw4w9WgXcQ' er jaigay boshan) -->

</body>
